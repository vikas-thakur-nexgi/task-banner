<body>

    <main class="profile-section">

        <div class="profile-section__container">

            <!-- Card 1 -->
            <article class="profile-card">
                <div class="profile-card__image">
                    <img src="https://i.pravatar.cc/300?img=12" alt="John Doe">
                </div>
                <div class="profile-card__content">
                    <span class="profile-card__role">
                        Frontend Developer
                    </span>
                    <h2 class="profile-card__name">
                        John Doe
                    </h2>
                    <p class="profile-card__description">
                        Passionate frontend developer who creates
                        responsive and user-friendly websites.
                    </p>
                    <div class="profile-card__skills">
                        <span class="profile-card__skill">HTML</span>
                        <span class="profile-card__skill">CSS</span>
                        <span class="profile-card__skill">JavaScript</span>
                        <span class="profile-card__skill">React</span>
                    </div>
                    <a href="#" class="profile-card__button">
                        View Profile
                    </a>
                </div>
            </article>
